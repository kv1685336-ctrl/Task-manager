<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task-manager</title>
    <style>
      body {
        background-color: #36013F;
        color: white;
        text-align: center;
        margin: 0;
        padding: 14px 20px;
      }
      textarea {
        background-color: #FF0000;
        color: black;
        width: 100%;
        max-width: 400px;
        height: 120px;
        padding: 12px;
        font-size: 16px;
        box-sizing: border-box;
        border-radius: 10px;
        border: 1px solid #FF0000;
      }
      #addTask {
        margin-top: 12px;
        padding: 12px 20px;
        background-color: #8A9A5B;
        color: black;
        border: none;
        border-radius: 10px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
      }
      #my-tasks {
        list-style: none;
        padding: 0;
        max-width: 400px;
        margin: 20px auto;
        text-align: left;
      }
      #my-tasks li {
        background-color: #FF0000;
        color: white;
        padding: 14px;
        margin-bottom: 20px;
        border-radius: 10px;
        overflow-wrap: anywhere;
      }
      
        
    </style>
  </head>
  
  
  <body>
    <h1>STUDENT TASK MANAGER</h1>
    <textarea> id="taskInput" placeHolder="write your task here"></textarea>
    <button id="addTask">add task</button>
    <h2>MY TASKS</h2>
    <ul id="my-tasks" ></ul>

    <script>
      
    </script>
    
  </body>
</html>
